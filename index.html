  <div id="root">
    <div
      style="background-color: #ffffff; color: #000000; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; flex-direction: column;">
      <h2 style="color: #000000; font-size: 14px; font-weight: 900; letter-spacing: 0.4em; text-transform: uppercase;">MULTIBRAND</h2>
      <p id="loading-status" style="margin-top: 10px; color: #999; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;">Cargando...</p>
      <div id="error-display"
        style="display: none; color: #ff4444; margin-top: 20px; max-width: 80%; text-align: center;"></div>
    </div>
  </div>
  <script>
    // Auto-reload si el browser intenta cargar un chunk JS viejo que ya no existe
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        if (!sessionStorage.getItem('_chunk_reload')) {
          sessionStorage.setItem('_chunk_reload', '1');
          window.location.reload(true);
        }
      }
    }, true);
    window.addEventListener('unhandledrejection', function(event) {
      var reason = String(event.reason || '');
      if (reason.includes('Failed to fetch') || reason.includes('Loading chunk') || reason.includes('dynamically imported module')) {
        if (!sessionStorage.getItem('_chunk_reload')) {
          sessionStorage.setItem('_chunk_reload', '1');
          window.location.reload(true);
        }
        return;
      }
      document.getElementById('loading-status').style.display = 'none';
      var errorDisplay = document.getElementById('error-display');
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML = '<strong>Promesa Rechazada:</strong><br>' + event.reason;
    });
    window.onerror = function (message, source, lineno, colno, error) {
      document.getElementById('loading-status').style.display = 'none';
      const errorDisplay = document.getElementById('error-display');
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML = '<strong>Error Crítico:</strong><br>' + message +
        '<br><small>' + source + ':' + lineno + '</small>';
    };
  </script>
